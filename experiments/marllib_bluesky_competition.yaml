env: bluesky_competition

env_args:
  map_name: competition_v0
  n_agents: 10
  n_obstacles: 5
  bluesky_workdir: .venv-marllib/bluesky-workdir

# The actor reads obs; MAPPO's centralized value network reads obs + state.
mask_flag: False
global_state_flag: True
opp_action_in_cc: False

# RLlib counts joint environment decisions; each contains 10 aligned agents.
fixed_batch_timesteps: 1024
agent_level_batch_update: False
