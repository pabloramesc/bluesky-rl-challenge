[project]
name = "bluesky-agents"
version = "0.1.0"
description = "Personal agents and experiments for TU Delft BlueSky-Gym"
requires-python = ">=3.10"
dependencies = ["bluesky-gym"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]

[tool.uv.sources]
bluesky-gym = { path = "vendor/bluesky-gym", editable = true }
